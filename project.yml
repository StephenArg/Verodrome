name: Verodrome
options:
  bundleIdPrefix: com.verodrome
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: R6WYB662P7
packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    from: "5.8.0"
  AudioStreaming:
    url: https://github.com/dimitris-c/AudioStreaming.git
    from: "1.4.0"
  Collections:
    url: https://github.com/apple/swift-collections.git
    from: "1.1.0"
  DominantColors:
    url: https://github.com/DenDmitriev/DominantColors.git
    from: "1.2.0"
  ID3TagEditor:
    url: https://github.com/chicio/ID3TagEditor.git
    from: "4.5.0"
targets:
  VerodromeKit:
    type: framework
    platform: iOS
    sources:
      - path: VerodromeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verodrome.VerodromeKit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
    dependencies:
      - package: Alamofire
      - package: AudioStreaming
      - package: Collections
      - package: DominantColors
      - package: ID3TagEditor
  Verodrome:
    type: application
    platform: iOS
    sources:
      - path: Verodrome
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verodrome.app
        INFOPLIST_FILE: Verodrome/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Verodrome/Resources/Verodrome.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
    dependencies:
      - target: VerodromeKit
      - package: Alamofire
      - package: AudioStreaming
      - package: DominantColors
    info:
      path: Verodrome/Resources/Info.plist
      properties:
        CFBundleDisplayName: Verodrome
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.verodrome.app.RefreshTask
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        LSRequiresIPhoneOS: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.verodrome.app
            CFBundleURLSchemes:
              - verodrome
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  VerodromeKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VerodromeKitTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verodrome.VerodromeKitTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VerodromeKit
schemes:
  Verodrome:
    build:
      targets:
        Verodrome: all
        VerodromeKit: all
    test:
      targets:
        - VerodromeKitTests
    run:
      config: Debug
      environmentVariables:
        OS_ACTIVITY_DT_MODE: YES
